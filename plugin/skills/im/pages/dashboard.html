<!doctype html>
<!--
  denden dashboard: served by the daemon at /ui/<token> (crates/denden/src/daemon.rs, ui_route), which
  replaces the placeholders NONCE (on both scripts) and CONFIG (once), between double braces below
  (CONFIG is JSON with "<" escaped, so it cannot close the script tag).
  Theme: light or dark, the one picked with the button (a cookie, shared by the dashboards of this
  machine whatever their port), else the system's.
  Read only: it polls GET <api> every few seconds with the x-denden header, sending what it already has
  (after=<cid>:<seq>,...), and gets back only what is new. Message texts come from other machines:
  they are only ever set as textContent, never as HTML.
  Layout: the channels on the left, the chosen channel's messages in the middle, who is in it (by
  machine) on the right. A click on a denden turns the middle into its page: its card, then what it
  sent and received. Markers: 📡 channel, 💻 machine, 🐌 denden, 💬 conversation, ✨ AI.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>denden dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle'%3E%F0%9F%90%8C%3C/text%3E%3C/svg%3E">
<style>
/* Flat and square: the columns fill their space, and shades, not borders, set things apart. */
:root {
  color-scheme: dark;
  --rail: #0b0d13; --bg: #11141c; --head: #181c27; --odd: #161a24; --even: #1c202c;
  --hover: rgba(255, 255, 255, .045); --chip: rgba(255, 255, 255, .075);
  --fg: #eef0f7; --muted: #9aa1b8; --faint: #646a82;
  --a1: #35d0ba; --a2: #8b7bff; --ok: #3ddc97; --warn: #f5b95b; --err: #ff6b7d; --tint: 11%; --lift: rgba(255, 255, 255, .03);
}
:root[data-theme="light"] {
  color-scheme: light;
  --rail: #e3e6ee; --bg: #f4f5f9; --head: #ffffff; --odd: #ffffff; --even: #f9fafc;
  --hover: rgba(20, 24, 40, .045); --chip: rgba(20, 24, 40, .065);
  --fg: #141726; --muted: #5a6176; --faint: #8b91a5;
  --a1: #0fa38d; --a2: #6a5af9; --ok: #12935e; --warn: #a8690f; --err: #d43a4f; --tint: 7%; --lift: rgba(255, 255, 255, .3);
}
/* Ten pastel colours, one per denden in the order the channel got them (the eleventh takes the first
   again): --pc, and --dc, the same deeper, for text and tints on the light theme. */
.c0 { --pc: hsl(210 75% 78%); --dc: hsl(210 60% 38%); }
.c1 { --pc: hsl(4 75% 78%); --dc: hsl(4 60% 40%); }
.c2 { --pc: hsl(145 55% 72%); --dc: hsl(145 50% 30%); }
.c3 { --pc: hsl(30 80% 76%); --dc: hsl(30 70% 36%); }
.c4 { --pc: hsl(280 70% 80%); --dc: hsl(280 45% 42%); }
.c5 { --pc: hsl(185 60% 72%); --dc: hsl(185 65% 28%); }
.c6 { --pc: hsl(325 75% 80%); --dc: hsl(325 55% 40%); }
.c7 { --pc: hsl(52 75% 72%); --dc: hsl(52 70% 28%); }
.c8 { --pc: hsl(95 50% 72%); --dc: hsl(95 45% 30%); }
.c9 { --pc: hsl(245 70% 82%); --dc: hsl(245 45% 46%); }
.ink { color: var(--pc); }
:root[data-theme="light"] .ink { color: var(--dc); }
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg) 18%, transparent) transparent; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--fg); background: var(--rail);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
}
code, .mono { font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
[hidden] { display: none !important; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); } .muted { color: var(--muted); } .faint { color: var(--faint); }
.dot::before { content: "●"; margin-right: 5px; font-size: 10px; vertical-align: 1px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; }
.logo { width: 30px; height: 30px; display: grid; place-items: center; font-size: 17px; line-height: 1; background: linear-gradient(135deg, var(--a1), var(--a2)); flex: none; }
.top h1 { margin: 0; font-size: 15px; font-weight: 650; }
.top .machine { color: var(--muted); font-weight: 500; }
.live { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
.live.down .pulse { background: var(--err); animation: none; }
.theme { appearance: none; flex: none; width: 34px; height: 30px; border: 0; background: var(--chip); cursor: pointer; font-size: 14px; line-height: 1; }
.theme:hover { background: color-mix(in srgb, var(--a2) 22%, transparent); }
@keyframes pulse { 50% { opacity: .35; } }

/* layout: three columns when wide, two (who's here under the channels) in between, one when narrow */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) 290px; grid-template-areas: "side main who"; min-height: 0; }
aside { display: contents; }
#side { grid-area: side; }
#who { grid-area: who; }
#side, #who { overflow: auto; overflow-x: hidden; padding: 16px 0 28px; }
main { grid-area: main; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
@media (max-width: 1179px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); grid-template-areas: "side main"; }
  aside { display: block; grid-area: side; overflow: auto; }
  #side, #who { overflow: visible; padding-bottom: 16px; }
  #who { background: color-mix(in srgb, var(--fg) 3%, var(--rail)); min-height: 100%; }
}
@media (max-width: 759px) {
  body { overflow: auto; display: block; }
  .layout { display: block; }
  #who { min-height: 0; }
  .feed { overflow: visible !important; }
  .head, .card, .day, .bar, .body, .event { padding-left: 16px; padding-right: 16px; }
}
.label { margin: 0 20px 8px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; padding: 0 20px; }
.hint code { color: var(--fg); display: block; margin-top: 2px; overflow-wrap: anywhere; }

/* channels */
#channels .row { padding: 10px 20px; }
.row { appearance: none; border: 0; background: none; text-align: left; width: 100%; cursor: pointer; padding: 6px 20px; display: block; }
.row:hover { background: var(--hover); }
.row.sel { background: color-mix(in srgb, var(--a2) 17%, transparent); box-shadow: inset 3px 0 0 var(--a2); }
.row:focus-visible { outline-offset: -2px; }
.line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state { display: block; font-size: 12px; }
.line .state { display: inline; margin-left: 2px; white-space: nowrap; }
.count { margin-left: auto; flex: none; min-width: 22px; padding: 0 7px; font-size: 11.5px; font-weight: 650; line-height: 20px; text-align: center; background: var(--a2); color: #fff; }

/* who's here */
.mach { margin: 0 0 14px; }
.mach > .line { padding: 0 20px; }
.mach-name { font-weight: 600; }
.mach > .state { padding: 0 20px 0 44px; margin-bottom: 4px; }
.dens { display: grid; grid-template-columns: minmax(0, 1fr); }
.dens .row { padding: 6px 20px 6px 44px; }
.dens .hint { padding-left: 44px; }
.blocked { padding: 12px 0 0; color: var(--faint); }
.blocked > div:not(.label) { padding: 0 20px; }

/* the channel and its messages */
.head { padding: 15px 24px; background: var(--head); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 18px; font-weight: 650; }
.back { appearance: none; margin-left: auto; border: 0; cursor: pointer; padding: 4px 12px; font-size: 12.5px; background: var(--chip); color: var(--fg); }
.back:hover { background: color-mix(in srgb, var(--a2) 22%, transparent); }
.card { padding: 14px 24px 16px; background: color-mix(in srgb, var(--pc, var(--a2)) var(--tint), var(--head)); }
:root[data-theme="light"] .card { background: color-mix(in srgb, var(--dc, var(--a2)) var(--tint), var(--head)); }
.card .label { margin: 0 0 3px; }
.card .role { font-size: 15px; overflow-wrap: anywhere; }
.facts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 8px; color: var(--muted); font-size: 12.5px; }
.facts > * + *::before { content: "·"; margin-right: 8px; color: var(--faint); }
.card .note { margin-top: 6px; color: var(--faint); font-size: 12px; }
.feed { flex: 1; min-height: 0; overflow: auto; padding: 0 0 28px; }
.day { padding: 18px 24px 8px; color: var(--faint); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
.block { margin-bottom: 2px; }
/* a whole block in its sender's colour, over one of two shades; its title bar a touch lighter */
.block.odd { --base: var(--odd); }
.block.even { --base: var(--even); }
.msg { background: color-mix(in srgb, var(--pc) var(--tint), var(--base)); }
:root[data-theme="light"] .msg { background: color-mix(in srgb, var(--dc) var(--tint), var(--base)); }
.bar { padding: 7px 24px; background: var(--lift); }
.body { padding: 10px 24px 12px; }
.msg.more .body { padding-top: 0; }
.msg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--a2) 22%, transparent); } }
.meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; }
.from { font-weight: 650; }
.to { color: var(--muted); font-size: 12.5px; }
.tag { font-size: 11.5px; line-height: 20px; padding: 0 8px; white-space: nowrap; background: var(--chip); color: var(--muted); }
.tag.q { color: var(--a2); background: color-mix(in srgb, var(--a2) 15%, transparent); }
.tag.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
time { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.re { appearance: none; display: block; text-align: left; border: 0; background: var(--chip); cursor: pointer; margin: 0 0 7px; padding: 3px 10px; color: var(--muted); font-size: 12.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.re:hover { color: var(--fg); background: color-mix(in srgb, var(--a2) 20%, transparent); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 1px; min-width: 0; }
.text.cut { max-height: 21em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.toggle { appearance: none; border: 0; background: none; cursor: pointer; color: var(--a2); padding: 2px 0; font-size: 12.5px; }
.waiting { font-size: 12px; color: var(--warn); margin-top: 2px; }
.event { text-align: center; color: var(--muted); font-size: 12.5px; padding: 9px 24px 11px; overflow-wrap: anywhere; }
.event.alert { color: var(--warn); }
.none { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 60px 20px; }
.none b { color: var(--fg); font-size: 15px; display: block; margin-bottom: 6px; }
.none code { color: var(--fg); }

.gone { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--rail) 80%, transparent); backdrop-filter: blur(6px); }
.gone div { max-width: 420px; text-align: center; padding: 28px; background: var(--head); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5); display: grid; gap: 10px; }
.gone p { margin: 0; color: var(--muted); }
.gone a { color: var(--a2); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<script nonce="{{NONCE}}">
  // The theme before the first paint: the one picked here, else the system's.
  document.documentElement.dataset.theme = /(?:^|; )denden_theme=(light|dark)/.exec(document.cookie)?.[1] || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
</script>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true">🐌</div>
  <h1>denden <span class="machine" id="machine"></span></h1>
  <div class="live" id="live" role="status"><span class="pulse"></span><span id="clock">connecting…</span></div>
  <button class="theme" id="theme" type="button"></button>
</header>
<div class="layout">
  <aside>
    <section id="side"><h3 class="label">Channels</h3><div id="channels"></div></section>
    <section id="who" hidden><h3 class="label" id="who-title">Who's here</h3><div id="machines"></div></section>
  </aside>
  <main>
    <div class="head" id="head" hidden>
      <h2 id="title"></h2><span class="muted" id="summary"></span>
      <button class="back" id="back" type="button" hidden></button>
    </div>
    <div class="card" id="card" hidden></div>
    <div class="feed" id="feed"></div>
  </main>
</div>
<div class="gone" id="gone" hidden><div><b>This dashboard has expired</b><p>Its address lives while the page is open and the denden daemon runs, 12 hours at most.</p><p><a href="/ui">Open it again</a> · or run <code>/denden:im ui</code> in a conversation, <code>denden ui</code> in a terminal.</p></div></div>
<script type="application/json" id="cfg">{{CONFIG}}</script>
<script nonce="{{NONCE}}">
(() => {
  const cfg = JSON.parse(document.getElementById('cfg').textContent)
  const $ = (id) => document.getElementById(id)
  // An element with its class and text; text only ever as textContent.
  const el = (tag, cls, text) => {
    const e = document.createElement(tag)
    if (cls) e.className = cls
    if (text != null) e.textContent = text
    return e
  }
  const keep = {
    get: (k) => { try { return sessionStorage.getItem(k) } catch { return null } },
    set: (k, v) => { try { sessionStorage.setItem(k, v) } catch {} },
  }

  // cid -> { info, msgs, keys, answered, seq, count, colours }: info is the last state the daemon sent,
  // msgs the messages so far (the last 3000), answered the ids of questions a reply points to,
  // colours the palette slot of each denden (see colour()).
  const chans = new Map()
  // sel: the chosen channel; agent: the denden whose page shows in the middle, '' for the channel's.
  let sel = keep.get('sel'), agent = keep.get('agent') || '', gone = false, fails = 0, since = 0, last = 0
  const opened = new Set()
  const drawn = {}

  const APPS = { claude: 'Claude Code', codex: 'Codex' }
  const appName = (a) => APPS[a] || a
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`
  const folder = (p) => (p || '').split(/[\\/]/).filter(Boolean).pop() || ''
  const convName = (v) => v.title || folder(v.cwd) || 'conversation'
  const convTip = (v) => `${v.cwd ? `${v.cwd} · ` : ''}active ${ago(v.seen)}`
  // What the conversations of this machine have not seen yet in a channel.
  const waiting = (c) => c.denden.reduce((n, d) => n + (d.mine && d.waiting || 0), 0)
  const day = (t) => {
    const d = new Date(t), now = new Date()
    if (d.toDateString() === now.toDateString()) return 'Today'
    if (d.toDateString() === new Date(now - 864e5).toDateString()) return 'Yesterday'
    return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' })
  }
  const clock = (t) => new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })
  const span = (ms) => {
    const m = Math.max(1, Math.round(ms / 60000))
    return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : plural(Math.round(m / 1440), 'day')
  }
  const ago = (t) => Date.now() - t < 60000 ? 'just now' : `${span(Date.now() - t)} ago`

  // ---------- polling ----------

  async function poll() {
    if (gone) return
    const after = [...chans].filter(([, c]) => c.seq != null).map(([cid, c]) => `${cid}:${c.seq}`).join(',')
    try {
      const r = await fetch(cfg.api + (after ? `?after=${after}` : ''), { headers: { 'x-denden': '1' }, cache: 'no-store' })
      if (r.status === 410) return expire()
      if (!r.ok) throw new Error(String(r.status))
      apply(await r.json())
      fails = 0
      last = Date.now()
    } catch {
      if (!fails++) since = Date.now()
      // Unreachable for a minute: the daemon stopped, and its addresses went with it.
      if (Date.now() - since > 60000) return expire()
    }
    status()
    setTimeout(poll, cfg.poll || 2000)
  }

  function expire() {
    gone = true
    $('gone').hidden = false
    $('live').classList.add('down')
    $('clock').textContent = 'expired'
  }

  function status() {
    const down = fails >= 2
    $('live').classList.toggle('down', down)
    $('clock').textContent = down ? 'cannot reach the denden daemon on this machine, retrying…' : last ? `live · ${clock(last)}` : 'connecting…'
  }

  function apply(d) {
    $('machine').textContent = d.machine ? `· 💻 ${d.machine}` : ''
    const live = new Set()
    for (const c of d.channels || []) {
      live.add(c.cid)
      let ch = chans.get(c.cid)
      if (ch && ch.seq != null && c.seq < ch.seq) {
        // Its history was reset: start over with a full load.
        chans.set(c.cid, { info: c, msgs: [], keys: new Set(), answered: new Set(), seq: null, count: 0, colours: ch.colours })
        continue
      }
      if (!ch) chans.set(c.cid, (ch = { msgs: [], keys: new Set(), answered: new Set(), seq: null, count: 0, colours: new Map() }))
      ch.info = c
      for (const n of [...c.denden].sort((a, b) => (a.since || 0) - (b.since || 0) || a.name.localeCompare(b.name))) colour(ch, n.name)
      for (const m of c.messages) {
        const k = m.kind === 'event' ? `event/${m.seq}` : `${m.from}/${m.id}`
        if (ch.keys.has(k)) continue
        ch.keys.add(k)
        if (m.kind !== 'event') colour(ch, m.from || '?')
        ch.msgs.push(m)
        if (m.re) ch.answered.add(m.re)
        ch.count++
      }
      if (ch.msgs.length > 3000) ch.msgs.splice(0, ch.msgs.length - 3000)
      ch.seq = c.seq
    }
    for (const cid of [...chans.keys()]) if (!live.has(cid)) chans.delete(cid)
    if (!chans.has(sel)) {
      sel = chans.keys().next().value ?? null
      agent = ''
    }
    render()
  }

  // A denden's colour, the class of its palette slot: the channel's denden take the ten slots in the
  // order the channel got them, then the senders it no longer has, and after ten it starts over. A
  // denden keeps its slot while the page is open.
  function colour(ch, name) {
    if (!ch.colours.has(name)) ch.colours.set(name, ch.colours.size % 10)
    return `c${ch.colours.get(name)}`
  }

  // Each part is rebuilt only when what it shows changed, so focus and scrolling stay put; a
  // focused row gets its focus back after a rebuild (rows carry data-key).
  function part(name, data, draw) {
    const sig = JSON.stringify(data)
    if (drawn[name] === sig) return
    drawn[name] = sig
    const key = document.activeElement?.dataset?.key
    draw()
    if (key) [...document.querySelectorAll('[data-key]')].find((e) => e.dataset.key === key)?.focus()
  }

  function select(cid, name) {
    sel = cid
    agent = name
    keep.set('sel', cid || '')
    keep.set('agent', name)
    render()
    // On a phone the middle comes below the lists: bring it into view.
    if (cid && matchMedia('(max-width: 759px)').matches) $('head').scrollIntoView({ block: 'start' })
  }

  // ---------- states, in the user's words ----------

  // A denden of this machine: how its conversation hears what comes.
  function localState(d) {
    const w = d.waiting ? ` · ${d.waiting} waiting` : ''
    if (!d.conv) return { text: d.waiting ? `${d.waiting} waiting` : 'Nothing waiting', short: 'no conversation', tone: d.waiting ? 'warn' : 'faint', title: 'No conversation holds this denden: its messages wait for one to join as it' }
    const c = d.conv
    const how = `${c.how}${c.wakes ? `, up to ${c.wakes} wake-ups an hour` : ''}`
    if (c.state === 'paused') return { text: `Paused${w}`, short: 'paused', tone: 'warn', title: 'Messages wait until the conversation resumes, or its user writes in it' }
    if (c.state === 'listening') return { text: `Listening${c.auto ? ' · acts on its own' : ''}`, short: 'listening', tone: 'ok', title: `Hears messages right away (${how})${c.auto ? '. It acts on requests without asking its user first.' : ''}` }
    return { text: `Gets messages at its next turn${w}`, short: 'next turn', tone: d.waiting ? 'warn' : 'muted', title: 'No listener runs right now: messages wait for its next turn' }
  }

  // A denden of another machine: all this machine knows is whether a conversation holds it.
  function remoteState(d, m) {
    if (!m || !m.online) return null
    return d.active ? { short: 'online', tone: 'ok' } : { short: 'no conversation', tone: 'muted' }
  }

  // ---------- drawing ----------

  function render() {
    const list = [...chans.values()].map((c) => c.info).sort((a, b) => a.label.localeCompare(b.label))
    part('channels', [list.map((c) => [c.cid, c.label, c.member, c.online, waiting(c)]), sel], () => drawChannels(list))
    const ch = chans.get(sel)
    $('head').hidden = $('who').hidden = !ch
    if (!ch) {
      drawn.feed = drawn.card = null
      $('card').hidden = true
      const none = el('div', 'none')
      none.append(el('b', null, 'Create your first channel'), document.createTextNode('In a conversation: '), el('code', null, '/denden:im create <channel> as <name>'))
      $('feed').replaceChildren(none)
      return
    }
    const c = ch.info
    const tick = Math.floor(Date.now() / 60000)
    part('who', [c.cid, c.label, c.machines, c.denden, agent, tick], () => drawWho(c))
    part('head', [c.cid, c.label, c.member, c.machines, c.denden.length, agent], () => drawHead(c))
    part('card', [c.cid, agent, c.denden.find((d) => d.name === agent), c.machines, tick], () => drawCard(c))
    part('feed', [c.cid, agent, ch.count, c.unseen, ch.answered.size, [...opened]], () => drawFeed(ch))
  }

  function drawChannels(list) {
    const box = $('channels')
    box.replaceChildren()
    if (!list.length) box.append(el('p', 'hint', 'This machine is in no channel yet.'))
    for (const c of list) {
      const row = el('button', 'row' + (c.cid === sel ? ' sel' : ''))
      row.type = 'button'
      row.dataset.key = `chan/${c.cid}`
      const line = el('span', 'line')
      line.append(el('span', null, '📡'), el('span', 'name', c.label))
      const n = waiting(c)
      if (n) {
        const count = el('span', 'count', String(n))
        count.title = 'messages not yet seen by the conversations of this machine'
        line.append(count)
      }
      const st = !c.member ? ['warn', 'Waiting to be admitted'] : c.online ? ['ok', `${plural(c.online, 'other machine')} online`] : ['faint', 'Nobody else online']
      row.append(line, el('span', `state dot ${st[0]}`, st[1]))
      row.addEventListener('click', () => select(c.cid, ''))
      box.append(row)
    }
  }

  function drawWho(c) {
    const ch = chans.get(c.cid)
    $('who-title').textContent = `Who's here · ${c.label}`
    const box = $('machines')
    box.replaceChildren()
    const rank = (m) => m.me ? 0 : m.online ? 1 : m.connecting ? 2 : 3
    const shown = c.machines.filter((m) => !m.blocked).sort((a, b) => rank(a) - rank(b) || (b.seen || 0) - (a.seen || 0) || a.name.localeCompare(b.name))
    for (const m of shown) {
      const sec = el('div', 'mach')
      const name = el('div', 'line')
      const n = el('span', 'mach-name', m.name)
      n.title = `fingerprint ${m.id}`
      name.append(el('span', null, '💻'), n)
      const st = m.me ? ['faint', 'This machine'] : m.online ? ['ok', 'Online'] : m.connecting ? ['faint', 'Connecting…'] : ['faint', m.seen ? `Offline · last seen ${ago(m.seen)}` : 'Offline']
      sec.append(name, el('span', `state ${m.me ? '' : 'dot '}${st[0]}`, st[1]))
      const dens = el('div', 'dens')
      // 🐌 name · state, then ✨ AI · role, and for this machine's ones 💬 the conversation holding it.
      for (const d of c.denden.filter((d) => d.machine === m.id).sort((a, b) => a.name.localeCompare(b.name))) {
        const row = el('button', `row ${colour(ch, d.name)}${agent === d.name ? ' sel' : ''}`)
        row.type = 'button'
        row.dataset.key = `who/${c.cid}/${d.name}`
        const line = el('span', 'line')
        line.append(el('span', null, '🐌'), el('span', m.online || m.me ? 'name ink' : 'name muted', d.name))
        const st = d.mine ? localState(d) : remoteState(d, m)
        if (st) {
          const s = el('span', `state dot ${st.tone}`, st.short)
          if (st.title) s.title = st.title
          line.append(s)
        }
        if (d.mine && d.waiting) {
          const count = el('span', 'count', String(d.waiting))
          count.title = 'messages its conversation has not seen yet'
          line.append(count)
        }
        row.append(line)
        const desc = [d.app ? `✨ ${appName(d.app)}` : '', d.role].filter(Boolean).join(' · ')
        if (desc) row.append(el('span', 'sub', desc))
        if (d.mine && d.conv) {
          const sub = el('span', 'sub', `💬 ${convName(d.conv)}`)
          sub.title = convTip(d.conv)
          row.append(sub)
        }
        row.addEventListener('click', () => select(c.cid, d.name))
        dens.append(row)
      }
      if (m.me && !dens.children.length) {
        const p = el('p', 'hint', 'No conversation of yours here yet')
        p.append(el('code', null, `/denden:im join ${c.label} as …`))
        dens.append(p)
      }
      sec.append(dens)
      box.append(sec)
    }
    const blocked = c.machines.filter((m) => m.blocked)
    if (blocked.length) {
      const sec = el('div', 'blocked')
      sec.append(el('div', 'label', 'Blocked on this machine'))
      for (const m of blocked) {
        const line = el('div', null, `💻 ${m.name}`)
        line.title = `fingerprint ${m.id} · its messages are ignored here`
        sec.append(line)
      }
      box.append(sec)
    }
  }

  // The channel's name and who is online, or the chosen denden's name and the way back to the channel.
  function drawHead(c) {
    const back = $('back')
    back.hidden = !agent
    $('title').className = agent ? `ink ${colour(chans.get(c.cid), agent)}` : ''
    if (agent) {
      $('title').textContent = `🐌 ${agent}`
      $('summary').textContent = ''
      back.textContent = `← 📡 ${c.label}`
      back.title = 'Show every message of the channel'
      return
    }
    $('title').textContent = `📡 ${c.label}`
    const machines = c.machines.filter((m) => !m.blocked)
    const online = machines.filter((m) => !m.me && m.online).map((m) => m.name)
    const who = online.length === 0 ? 'nobody else online' : online.length <= 2 ? `💻 ${online.join(', ')} online` : `${online.length} other machines online`
    $('summary').textContent = !c.member ? 'waiting to be admitted' : `${plural(machines.length, 'machine')} · ${c.denden.length} denden · ${who}`
  }

  $('back').addEventListener('click', () => select(sel, ''))

  // The chosen denden's card: its role, then its machine, its AI, its conversation and its state.
  function drawCard(c) {
    const box = $('card')
    box.hidden = !agent
    box.replaceChildren()
    if (!agent) return
    box.className = `card ${colour(chans.get(c.cid), agent)}`
    const d = c.denden.find((x) => x.name === agent)
    if (!d) {
      box.append(el('div', 'muted', `🐌 ${agent} is no longer in this channel.`))
      return
    }
    const m = c.machines.find((x) => x.id === d.machine)
    box.append(el('div', 'label', 'Role'), el('div', d.role ? 'role' : 'role faint', d.role || 'No role'))
    const facts = el('div', 'facts')
    const machine = el('span', null, `💻 ${m ? m.name : 'unknown machine'}${m?.me ? ' (this machine)' : ''}`)
    if (m) machine.title = `fingerprint ${m.id}`
    facts.append(machine)
    if (d.app) facts.append(el('span', null, `✨ ${appName(d.app)}`))
    if (d.mine && d.conv) {
      const conv = el('span', null, `💬 ${convName(d.conv)}`)
      conv.title = convTip(d.conv)
      facts.append(conv)
    }
    if (d.mine) {
      const st = localState(d)
      const s = el('span', `dot ${st.tone}`, st.text)
      s.title = st.title
      facts.append(s)
    } else {
      const st = !m?.online ? ['faint', 'Offline'] : d.active ? ['ok', 'Online'] : ['muted', 'No conversation']
      facts.append(el('span', `dot ${st[0]}`, st[1]))
    }
    box.append(facts)
    if (!d.mine) box.append(el('div', 'note', 'Only its exchanges with the denden of this machine show here: the others never reach it.'))
  }

  // Light or dark: the pick lives in a cookie for every dashboard of this machine; until one is
  // picked, the page follows the system.
  const html = document.documentElement
  const picked = () => /(?:^|; )denden_theme=(light|dark)/.test(document.cookie)
  function drawTheme() {
    const light = html.dataset.theme === 'light'
    $('theme').textContent = light ? '🌙' : '☀️'
    $('theme').title = light ? 'Switch to the dark theme' : 'Switch to the light theme'
    $('theme').setAttribute('aria-label', $('theme').title)
  }
  $('theme').addEventListener('click', () => {
    html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light'
    document.cookie = `denden_theme=${html.dataset.theme}; Path=/; Max-Age=31536000; SameSite=Strict`
    drawTheme()
  })
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
    if (picked()) return
    html.dataset.theme = e.matches ? 'light' : 'dark'
    drawTheme()
  })
  drawTheme()

  // The feed follows the newest message until the reader scrolls up, and stays where they are then.
  let lastFeed = null, stick = true
  function drawFeed(ch) {
    const box = $('feed'), c = ch.info
    if (lastFeed !== `${c.cid}|${agent}`) stick = true
    lastFeed = `${c.cid}|${agent}`
    const at = box.scrollTop
    box.replaceChildren()
    // A denden's page: what it sent and received, and the events about it.
    const shown = !agent ? ch.msgs : ch.msgs.filter((m) => m.kind === 'event'
      ? m.d === agent || about(m) === agent
      : m.from === agent || m.to === 'all' || m.to === agent || (Array.isArray(m.to) && m.to.includes(agent)))
    if (!shown.some((m) => m.kind !== 'event')) {
      const none = el('div', 'none')
      none.append(el('b', null, agent ? `No messages from or to 🐌 ${agent} yet` : 'No messages yet'))
      if (!agent) none.append(document.createTextNode('The messages of this machine’s denden show here.'))
      box.append(none)
    }
    // Each block (a header and the messages that follow it) takes the other shade than the one before.
    let current = '', prev = null, block = null, blocks = 0
    for (const m of shown) {
      const dd = day(m.at)
      if (dd !== current) {
        box.append(el('div', 'day', (current = dd)))
        prev = null
      }
      if (m.kind === 'event') {
        box.append(el('div', 'event' + (m.alert ? ' alert' : ''), `${eventText(m)} · ${clock(m.at)}`))
        prev = null
        continue
      }
      // A message right after one with the same sender and recipients, nothing special: no header.
      const plain = !m.ask && !m.re && !m.late
      const more = plain && prev && prev.plain && prev.from === m.from && JSON.stringify(prev.to) === JSON.stringify(m.to) && m.at - prev.at < 5 * 60000
      if (!more) box.append((block = el('div', `block ${blocks++ % 2 ? 'even' : 'odd'}`)))
      block.append(message(ch, m, more))
      prev = { from: m.from, to: m.to, at: m.at, plain }
    }
    box.scrollTop = stick ? box.scrollHeight : at
  }

  function message(ch, m, more) {
    const art = el('article', `msg ${colour(ch, m.from || '?')}${more ? ' more' : ''}`)
    art.dataset.id = m.id
    if (!more) {
      const meta = el('div', 'meta bar')
      meta.append(el('span', 'from ink', `🐌 ${m.from || 'unknown'}`))
      meta.append(el('span', 'to', m.to === 'all' ? '→ 📣 everyone' : `→ ${(Array.isArray(m.to) ? m.to : [m.to]).map((n) => `🐌 ${n}`).join(', ')}`))
      if (m.ask) {
        meta.append(el('span', 'tag q', '❓ question'))
        meta.append(ch.answered.has(m.id) ? el('span', 'tag ok', '✅ answered') : el('span', 'tag warn', '⏳ waiting for an answer'))
      }
      if (m.late) {
        const l = el('span', 'tag warn', `⚠️ delivered ${span(m.waited)} late`)
        l.title = 'it waited on the sender’s machine until this one was online'
        meta.append(l)
      }
      meta.append(stamp(m))
      art.append(meta)
    }
    const body = el('div', 'body')
    art.append(body)
    if (m.re) {
      const q = el('button', 're', `↩️ answers: ${m.reText || 'an earlier question'}`)
      q.type = 'button'
      q.title = 'Show the question'
      q.addEventListener('click', () => reveal(m.re))
      body.append(q)
    }
    const key = `${m.from}/${m.id}`
    const text = el('div', 'text', m.text ?? '')
    if (more) {
      const row = el('div', 'meta')
      text.style.flex = '1'
      row.append(text, stamp(m))
      body.append(row)
    } else {
      body.append(text)
    }
    if ((m.text || '').split('\n').length > 15 || (m.text || '').length > 1500) {
      const open = opened.has(key)
      text.classList.toggle('cut', !open)
      const t = el('button', 'toggle', open ? 'Show less' : 'Show more')
      t.type = 'button'
      t.addEventListener('click', () => {
        opened.has(key) ? opened.delete(key) : opened.add(key)
        stick = false
        render()
      })
      body.append(t)
    }
    const unseen = ch.info.unseen?.[key]
    if (unseen?.length) body.append(el('div', 'waiting', `⏳ not seen yet by ${unseen.map((d) => `🐌 ${d}`).join(', ')}`))
    return art
  }

  const ROLE = /^New role for (\S+): "(.*)"$/, UNSET = /^(\S+) no longer has a role$/
  // The denden an event of the whole channel is about, if it is about one.
  const about = (m) => (ROLE.exec(m.text || '') || UNSET.exec(m.text || ''))?.[1]

  // A channel event in the page's words when it is a known one, else as denden wrote it.
  function eventText(m) {
    const joined = /^New machine in .+?: (.+) \[([0-9a-f-]+)\], invited by (.+)$/.exec(m.text || '')
    if (joined) return `💻 ${joined[1]} joined, invited by 💻 ${joined[3]}`
    const role = ROLE.exec(m.text || '')
    if (role) return `🐌 ${role[1]} · new role: ${role[2]}`
    const unset = UNSET.exec(m.text || '')
    if (unset) return `🐌 ${unset[1]} · role removed`
    return `${m.alert && !/^⚠/.test(m.text) ? '⚠️ ' : ''}${m.text}`
  }

  function stamp(m) {
    const t = el('time', null, clock(m.at))
    t.dateTime = new Date(m.at).toISOString()
    t.title = new Date(m.at).toLocaleString()
    return t
  }

  // Scrolls to a question (showing the whole channel first when a denden's page leaves it out), and marks it.
  function reveal(id) {
    const find = () => [...$('feed').querySelectorAll('article')].find((a) => a.dataset.id === id)
    let target = find()
    if (!target && agent) {
      select(sel, '')
      target = find()
    }
    if (!target) return
    stick = false
    target.scrollIntoView({ block: 'center', behavior: 'smooth' })
    target.classList.remove('flash')
    void target.offsetWidth
    target.classList.add('flash')
  }

  $('feed').addEventListener('scroll', () => {
    const f = $('feed')
    stick = f.scrollHeight - f.scrollTop - f.clientHeight < 60
  })
  new ResizeObserver(() => { if (stick) $('feed').scrollTop = $('feed').scrollHeight }).observe($('feed'))

  poll()
})()
</script>
</body>
</html>
