[package]
name = "denden"
version = "0.6.1"
edition = "2024"
publish = false
description = "denden: peer-to-peer messaging between AI conversations. The denden CLI, its daemon and its MCP server."

[[bin]]
name = "denden"
path = "src/main.rs"

[dependencies]
peeroxide = "1.7.3"
peeroxide-dht = "1.7.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util", "signal"] }
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
rand = "0.9"
regex-lite = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[features]
# peeroxide's own tracing in the daemon log, filtered by DENDEN_TRACE (e.g. "peeroxide=debug").
# Off by default: diagnostics only.
trace = ["dep:tracing-subscriber"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
